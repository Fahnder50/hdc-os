profile_id: PC-0003-firewall-appliance
base_profile: profiles/base.yaml
version: "2.0"
case_id: PC-0003
name: OPNsense Firewall Appliance against WO-0032
status: approved
approved_at: "2026-07-31"
architecture_reference: WO-0032
requirements:
  - {id: PC3-001, title: OPNsense, description: Appliance unterstützt OPNsense dauerhaft und ohne Hardwareaustausch für den Zielzustand., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 ND-02}}
  - {id: PC3-002, title: WAN/LAN-Trennung, description: Mindestens zwei physisch unabhängige Ethernet-Interfaces ermöglichen getrennte WAN- und LAN-Zuordnung., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 Abschnitt 3.2}}
  - {id: PC3-003, title: VLAN, description: IEEE 802.1Q und mehrere interne Netze werden unterstützt., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 Abschnitt 5.5}}
  - {id: PC3-004, title: DSL-Leistung, description: Firewall- und Routing-Leistung übersteigt den geplanten DSL-Anschluss mit deutlicher Reserve., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 PC-0003 Gate}}
  - {id: PC3-005, title: VPN, description: Appliance besitzt dokumentierte VPN-Leistung und kann als VPN-Endpunkt oder Policy-Routing-Punkt dienen., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 Abschnitt 5.6}}
  - {id: PC3-006, title: Lokaler Betrieb, description: Regelbetrieb und Administration sind vollständig lokal ohne Hersteller-Cloud möglich., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 ND-09}}
  - {id: PC3-007, title: Lizenzmodell, description: Keine verpflichtende laufende Lizenz ist für den Open-Source-Regelbetrieb erforderlich., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 Querschnittsgate}}
  - {id: PC3-008, title: Lokale Konsole, description: Lokaler Wiederherstellungs- oder Konsolenzugang ist vorhanden., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 Migration Schritt 3}}
  - {id: PC3-009, title: Rack-Kompatibilität, description: Maße, Gewicht, Belüftung und Montage auf einem Rackfachboden sind dokumentiert und mit PC-0002 bewertbar., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 PC-0003 Gate}}
  - {id: PC3-010, title: Rack-USV-Kompatibilität, description: Eingangsspannung, maximale Stromaufnahme, typische Leistungsaufnahme und EU-Anschluss sind dokumentiert und mit PC-0005 bewertbar., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 PC-0003 Gate}}
  - {id: PC3-011, title: Konfigurationssicherung, description: Lokales Backup und Restore der Firewall-Konfiguration sind möglich., status: CONFIRMED, priority: MUST, validation_type: documented, source: {type: architecture, reference: WO-0032 Migration Schritt 3}}
  - {id: PC3-012, title: Exaktes Modell, description: Angebot ist einem eindeutigen Hersteller und Modell zugeordnet; OEM-Varianten werden nicht vermischt., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: architecture, reference: WO-0032 Abschnitt 9}}
  - {id: PC3-013, title: Lieferumfang, description: RAM, Storage, Netzteil, EU-Netzkabel und Betriebssystemstatus werden je Angebot erfasst., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: procurement, reference: WO-0033}}
  - {id: PC3-014, title: Gesamtpreis, description: Gesamtpreis einschließlich Versand ist bekannt und liegt innerhalb der modellbezogenen Grenze., status: CONFIRMED, priority: MUST, validation_type: price, source: {type: procurement, reference: WO-0033}}
  - {id: PC3-015, title: Zustand und Gewährleistung, description: Nur neue Geräte mit nachvollziehbarer Garantie oder Gewährleistung sind kaufbar., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: procurement, reference: WO-0033}}
  - {id: PC3-P01, title: Fachboden-Zuordnung, description: PC-0002 soll einen belüfteten Fachboden für die Desktop-Appliance vorsehen., status: PROPOSED, priority: SHOULD, validation_type: decision, source: {type: procurement_proposal, reference: WO-0033}}
  - {id: PC3-O01, title: Tatsächlicher DSL-Tarif, description: Die konkrete maximale DSL-Datenrate ist vor Inbetriebnahme zu inventarisieren; sie blockiert die Kaufempfehlung wegen der dokumentierten Leistungsreserve nicht., status: OPEN, priority: INFORMATIONAL, validation_type: decision, source: {type: open_decision, reference: WO-0033}}
  - {id: PC3-O02, title: Rack-USV-Steckdosen, description: Steckdosentyp und verfügbare Kapazität der späteren Rack-USV werden in PC-0005 bestätigt., status: OPEN, priority: INFORMATIONAL, validation_type: decision, source: {type: open_decision, reference: WO-0033}}
