need:
  description: >-
    Lokal verwalteter, lüfterloser VLAN-Switch zwischen OPNsense und produktiven
    Clients sowie dem künftigen Access Point.
  topology: Speedport -> OPNsense -> Managed Switch -> Clients / Access Point

port_plan:
  firewall_uplink: 1
  ps5: 1
  sky_box: 1
  access_point: 1
  hdc_os_host: 1
  maintenance: 1
  reserve: 2
  minimum_physical_rj45_ports: 8

poe_decision:
  option: A
  decision: PoE is economically sensible in Horizon 1
  rationale: >-
    Ein geplanter Access Point kann mit 802.3af/at zentral aus der Rack-USV
    versorgt werden. Der beobachtete Mehrpreis der PoE-Variante gegenüber dem
    günstigsten Nicht-PoE-Kandidaten ist kleiner als oder ähnlich hoch wie ein
    separater qualifizierter PoE+-Injector einschließlich zusätzlicher
    Stromversorgung. PoE ist kein Architecture Gate; bei einem günstigeren
    Gesamtpreis bleibt Nicht-PoE plus Injector zulässig.
  minimum_standard: IEEE 802.3af/at PoE+
  minimum_per_port_watts: 30
  minimum_total_budget_watts: 30
  selected_budget_watts: 62
  usable_poe_ports: 4
  access_point_cross_case_gate:
    required_standard: IEEE 802.3af/at
    maximum_per_port_watts: 30
    total_budget_watts: 62
    failure_action: Re-evaluate PC-0004 before access point purchase

