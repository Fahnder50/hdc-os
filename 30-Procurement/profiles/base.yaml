requirements:
  - {id: BASE-001, title: HDC-OS-Heimdatacenter, description: Einsatz im privaten HDC-OS-Heimdatacenter., status: CONFIRMED, priority: MUST, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-002, title: 24/7-Betrieb, description: Kritische Infrastruktur ist für 24/7-Betrieb geeignet., status: CONFIRMED, priority: MUST, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-003, title: Lokale Nutzbarkeit, description: Grundfunktionen sind lokal nutzbar., status: CONFIRMED, priority: MUST, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-004, title: Keine Cloud-Abhängigkeit, description: Der Regelbetrieb hat keine zwingende Cloud-Abhängigkeit., status: CONFIRMED, priority: MUST, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-005, title: Open Source und Lizenzen, description: Open-Source-Lösungen und Lösungen ohne laufende Lizenzkosten werden bevorzugt., status: CONFIRMED, priority: SHOULD, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-006, title: Gesamtbudget, description: Die Gesamtauswahl wird innerhalb des HDC-OS-Gesamtbudgets von ungefähr 2000 EUR betrachtet., status: CONFIRMED, priority: MUST, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-007, title: Nachvollziehbare Kaufentscheidung, description: Kaufentscheidungen werden nachvollziehbar dokumentiert., status: CONFIRMED, priority: MUST, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-008, title: Project-Owner-Freigabe, description: Produktauswahl und wesentliche Änderungen benötigen die Freigabe des Project Owners., status: CONFIRMED, priority: MUST, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-009, title: Umzugstauglichkeit, description: Komponenten sollen umzugstauglich sein., status: CONFIRMED, priority: SHOULD, validation_type: documented, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-010, title: Produktzuordnung, description: Angebote sind einem konkreten Produktmodell und erkennbaren Händler zugeordnet., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-011, title: Gültiger Preis, description: Preise 0 EUR, negative oder technisch nicht verwertbare Preise sind keine kaufbaren Angebote., status: CONFIRMED, priority: MUST, validation_type: price, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-012, title: Unbekannter Preis, description: Ein unbekannter Preis darf nicht als innerhalb des Budgets bewertet werden., status: CONFIRMED, priority: MUST, validation_type: price, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-013, title: Endpreis, description: Der Endpreis berücksichtigt Versandkosten oder ist ausdrücklich als unvollständig bekannt markiert., status: CONFIRMED, priority: MUST, validation_type: price, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-014, title: Angebotsquarantäne, description: Nicht eindeutig zuordenbare Angebote werden quarantänisiert., status: CONFIRMED, priority: MUST, validation_type: evidence, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-015, title: Garantie, description: Neugeräte mit nachvollziehbarer Gewährleistung oder Garantie werden bevorzugt., status: CONFIRMED, priority: SHOULD, validation_type: evidence, source: {type: project_decision, reference: RWO-0019, approved_by: Project Owner}}
  - {id: BASE-P01, title: EU-Erhältlichkeit, description: Produkt ist in Deutschland oder der EU regulär erhältlich., status: PROPOSED, priority: SHOULD, validation_type: evidence, source: {type: architecture_proposal, reference: RWO-0019}}
  - {id: BASE-P02, title: Hersteller- und Modellnummer, description: Produkt besitzt eine eindeutige Hersteller- und Modellnummer., status: PROPOSED, priority: SHOULD, validation_type: evidence, source: {type: architecture_proposal, reference: RWO-0019}}
  - {id: BASE-P03, title: Produktgeneration, description: Produktgeneration ist nicht abgekündigt oder ungepflegt., status: PROPOSED, priority: SHOULD, validation_type: evidence, source: {type: architecture_proposal, reference: RWO-0019}}
  - {id: BASE-P04, title: Dokumentationszugang, description: Dokumentation ist ohne Pflichtkonto abrufbar., status: PROPOSED, priority: SHOULD, validation_type: evidence, source: {type: architecture_proposal, reference: RWO-0019}}
  - {id: BASE-P05, title: Sicherheitsupdates, description: Grundlegende Firmware- und Sicherheitsupdates sind ohne kostenpflichtiges Abonnement verfügbar., status: PROPOSED, priority: SHOULD, validation_type: evidence, source: {type: architecture_proposal, reference: RWO-0019}}
  - {id: BASE-P06, title: Lieferumfang, description: Lieferumfang ist für die geplante Installation vollständig., status: PROPOSED, priority: SHOULD, validation_type: evidence, source: {type: architecture_proposal, reference: RWO-0019}}
  - {id: BASE-P07, title: Austausch, description: Ersatz oder Austausch ist in Deutschland oder der EU realistisch möglich., status: PROPOSED, priority: SHOULD, validation_type: evidence, source: {type: architecture_proposal, reference: RWO-0019}}
