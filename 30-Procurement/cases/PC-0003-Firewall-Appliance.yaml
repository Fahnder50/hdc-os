architecture_gates:
  opnsense_support:
    status: PASS
    evidence: Deciso liefert DEC697 mit OPNsense vorinstalliert; Open-Source-Lizenz plus ein Jahr Business Edition.
  physical_wan_lan:
    status: PASS
    evidence: Vier unabhängige 2.5GbE-RJ45-Ports erlauben getrennte WAN- und LAN-Zuordnung.
  vlan_802_1q:
    status: PASS
    evidence: Hersteller dokumentiert bis zu 4093 virtuelle 802.1Q-Interfaces.
  dsl_performance_with_reserve:
    status: PASS
    evidence: 5Gbps Firewall-, 2.3Gbps Port-to-Port- und 600Mbps IPsec-Durchsatz liegen deutlich oberhalb eines DSL-Anschlusses.
  local_no_cloud:
    status: PASS
    evidence: OPNsense Open Source ist vorinstalliert; keine Cloud oder laufende Lizenz ist für den Regelbetrieb erforderlich.
  local_console:
    status: PASS
    evidence: Dedizierter Console-Port und Konfigurationskabel sind dokumentiert.
  rack_compatibility:
    status: PASS
    evidence: Desktopgerät 22x185x134mm, 0.6kg; Betrieb auf belüftetem Rackboden. PC-0002 muss einen geeigneten Fachboden bereitstellen.
  rack_ups_compatibility:
    status: PASS
    evidence: 100-240VAC, 50-60Hz, maximal 0.4A, typisch 13W; passendes EU-Netzkabel ist Kaufbedingung und die Last ist in PC-0005 einzurechnen.
  local_backup_restore:
    status: PASS
    evidence: OPNsense-Konfigurationsbackup und lokale Konsole sind Bestandteil des Plattform- und Migrationsdesigns; Umsetzung erfolgt außerhalb dieses Cases.
  vpn_ready:
    status: PASS
    evidence: Hersteller dokumentiert 600Mbps IPsec AES256GCM16.

